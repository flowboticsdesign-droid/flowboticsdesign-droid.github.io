<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowBotics World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen 3D island; HUD floats on the edges; zone panel slides in from the right (bottom sheet on phones). Single deliberate night look. */
:root{
  --night:#0A111C; --panel:#0F1826; --panel-2:#152234; --line:#22324A;
  --ink:#ECF1F6; --mute:#9AA8B9; --dim:#6A7A8E;
  --leaf:#2FA557; --leaf-2:#3CC56A;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px}
.mono{font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}

/* HUD top */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;background:rgba(10,17,28,.72);border:1px solid var(--line);border-radius:14px;padding:9px 14px;backdrop-filter:blur(10px)}
.brand img{height:22px;width:auto;display:block}
.brand .who{font-size:11px;color:var(--mute);border-left:1px solid var(--line);padding-left:12px;line-height:1.3}
.brand .who b{color:var(--ink);font-weight:600;display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px}
.lang{display:flex;background:rgba(10,17,28,.72);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
.lang button{min-width:44px;min-height:38px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:600 12px var(--f-mono);letter-spacing:.06em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--night)}

/* Dock bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock>*{pointer-events:auto}
.tourbtn{flex:none;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;border-radius:999px;border:0;background:var(--leaf);color:#05140A;font-weight:600;cursor:pointer;box-shadow:0 8px 26px rgba(47,165,87,.35)}
.tourbtn[aria-pressed="true"]{background:var(--ink)}
.zones{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:rgba(10,17,28,.72);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px);min-width:0}
.zones::-webkit-scrollbar{display:none}
.zbtn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--mute);font-size:13px;cursor:pointer;white-space:nowrap}
.zbtn:hover{color:var(--ink);background:var(--panel-2)}
.zbtn[aria-current="true"]{background:var(--panel-2);color:var(--ink)}
.zbtn i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;font-size:11px;color:var(--mute);background:rgba(10,17,28,.6);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;pointer-events:none;transition:opacity .6s}

/* Intro */
.intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(10,17,28,.92) 0%,rgba(10,17,28,.72) 45%,rgba(10,17,28,0) 75%)}
.intro-card{max-width:560px;margin-left:clamp(0px,6vw,96px)}
.intro .eyebrow{font-size:12px;color:var(--leaf-2)}
.intro h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5.4vw,68px);line-height:1.02;letter-spacing:-.03em;margin:18px 0 18px;text-wrap:balance}
.intro h1 span{color:var(--leaf-2)}
.intro p{color:var(--mute);font-size:17px;line-height:1.6;margin:0 0 30px;max-width:48ch}
.intro .row{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--leaf)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#05140A}
.keys{margin-top:26px;display:flex;flex-wrap:wrap;gap:16px;color:var(--dim);font-size:12px}
.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--mute);margin-right:4px}

/* Panel */
.panel{position:fixed;z-index:25;top:calc(76px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100vw - 32px));background:rgba(15,24,38,.94);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);
  display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.p-head{padding:22px 24px 18px;border-bottom:1px solid var(--line);position:relative}
.p-tag{font-size:11px;color:var(--c)}
.p-head h2{font-family:var(--f-display);font-size:24px;line-height:1.15;font-weight:700;margin:10px 0 10px;text-wrap:balance}
.p-head p{margin:0;color:var(--mute);line-height:1.6;font-size:15px}
.p-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--mute)}
.p-close:hover{color:var(--ink)}
.p-body{padding:18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.sim{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);line-height:1.5;background:var(--panel-2);border-radius:12px;padding:12px 14px}
.sim b{color:var(--c);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;flex:none;padding-top:2px}
.proj{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.proj .t{font-weight:600;font-size:15px;line-height:1.35}
.proj .st{align-self:flex-start;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sc);border:1px solid var(--sc);border-radius:999px;padding:3px 9px}
.proj .c{font-size:13px;color:var(--mute)}
.proj .r{font-size:13px;color:var(--c);font-weight:600}
.proj .s{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.proj .s span{font-family:var(--f-mono);font-size:10px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:3px 7px}
.tl .y{font-family:var(--f-mono);font-size:11px;color:var(--c)}
.contact-mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact-mail code{font-family:var(--f-mono);font-size:13px;background:var(--panel-2);border-radius:8px;padding:10px 12px;user-select:all;min-width:0;overflow-wrap:anywhere}
.p-foot{padding:14px 24px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.p-foot .btn{min-height:44px;padding:0 18px;font-size:14px}
.progress{height:3px;background:var(--line);border-radius:3px;flex:1 1 100%;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--c)}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute)}

@media (max-width:760px){
  .brand .who{display:none}
  .panel{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;height:min(62vh,560px);bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 110px))}
  .panel.open{transform:none}
  .intro{align-items:flex-end;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(10,17,28,.95) 0%,rgba(10,17,28,.8) 55%,rgba(10,17,28,0) 100%)}
  .intro-card{margin-left:0}
  .intro p{font-size:15px}
  .keys{display:none}
  .tourbtn span{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>

</head>

 updaters.push(function(t,dt){piv.rotation.y+=dt*0.7;pods.forEach(function(p){p.g.position.y=5+Math.sin(t*0.9+p.k*2)*0.5;p.c.rotation.y+=dt;p.c.rotation.x+=dt*0.6;});});})();

/* labels */
function textSprite(txt,color,scale,x,y,z){var c=document.createElement("canvas");c.width=512;c.height=128;var ctx=c.getContext("2d");
 ctx.font="600 54px 'JetBrains Mono', monospace";var w=Math.min(500,ctx.measureText(txt).width+56);
 ctx.fillStyle="rgba(10,17,28,0.82)";roundRect(ctx,(512-w)/2,20,w,88,22);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle=color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,256,66);
 var t=new THREE.CanvasTexture(c);t.anisotropy=4;var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(4*scale*2,1*scale*2,1);s.position.set(x,y,z);return s;}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function zoneLabel(i){var z=ZONES[i];var c=document.createElement("canvas");c.width=1024;c.height=200;var ctx=c.getContext("2d");
 ctx.font="700 64px Unbounded, 'IBM Plex Sans', sans-serif";var w=Math.min(1000,ctx.measureText(L(z.name)).width+90);
 ctx.fillStyle="rgba(10,17,28,0.85)";roundRect(ctx,(1024-w)/2,30,w,140,40);ctx.fill();ctx.strokeStyle=z.color;ctx.lineWidth=4;ctx.stroke();
 ctx.fillStyle="#ECF1F6";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(L(z.name),512,102);
 var t=new THREE.CanvasTexture(c);t.anisotropy=4;var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(12,2.35,1);s.position.set(structPos[i].x,13.5,structPos[i].z);return s;}
function rebuildLabels(){labelSprites.forEach(function(s){scene.remove(s);s.material.map.dispose();s.material.dispose();});labelSprites=ZONES.map(function(z,i){var s=zoneLabel(i);scene.add(s);return s;});}
var fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
fontsReady.then(function(){labelsReady=true;rebuildLabels();});

/* movement */
var target=null,waypoint=null,vel=new THREE.Vector3(),keys={};
function setTarget(x,z,viaPlaza){var p=new THREE.Vector2(x,z);var r=Math.hypot(x,z);if(r>43){p.multiplyScalar(43/r);}
 target=new THREE.Vector3(p.x,0,p.y);waypoint=null;
 var a=new THREE.Vector2(bot.position.x,bot.position.z),b=new THREE.Vector2(target.x,target.z),ab=b.clone().sub(a),len=ab.length();
 if(len>1){var tt=Math.max(0,Math.min(1,-a.dot(ab)/(len*len)));var cl=a.clone().add(ab.clone().multiplyScalar(tt));if(cl.length()<6.5){var perp=new THREE.Vector2(-ab.y,ab.x).normalize();if(perp.dot(cl)<0)perp.negate();if(cl.length()<0.01)perp.set(-ab.y,ab.x).normalize();waypoint=new THREE.Vector3(perp.x*11,0,perp.y*11);}}}
window.addEventListener("keydown",function(e){if(e.target.closest&&e.target.closest("input,textarea"))return;var k=e.key.toLowerCase();
 if(k==="escape"){closePanel(true);return;}
 if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d","z","q"].indexOf(k)>-1){keys[k]=true;hideIntro();stopTour();target=null;waypoint=null;if(k.indexOf("arrow")===0)e.preventDefault();}});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
var ray=new THREE.Raycaster(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0),down=null;
renderer.domElement.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener("pointerup",function(e){if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(dx*dx+dy*dy>64)return;
 hideIntro();var m=new THREE.Vector2(e.clientX/window.innerWidth*2-1,-(e.clientY/window.innerHeight)*2+1);ray.setFromCamera(m,camera);var hit=new THREE.Vector3();
 if(ray.ray.intersectPlane(ground,hit)){stopTour();setTarget(hit.x,hit.z);marker.position.set(target.x,0.25,target.z);marker.material.opacity=1;}});
var marker=new THREE.Mesh(new THREE.RingGeometry(0.4,0.6,24),new THREE.MeshBasicMaterial({color:ACC,transparent:true,opacity:0,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;scene.add(marker);

var camOff=new THREE.Vector3(0,24,27),camPos=new THREE.Vector3(),look=new THREE.Vector3();
function fitCam(){var asp=window.innerWidth/window.innerHeight;var k=asp<0.8?1.5:1;camOff.set(0,24*k,27*k);}
fitCam();camPos.copy(bot.position).add(camOff);camera.position.copy(camPos);
window.addEventListener("resize",function(){renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();fitCam();});

var clock=new THREE.Clock(),T=0,hintEl=document.getElementById("hint"),hintT=0;
function frame(){requestAnimationFrame(frame);var dt=Math.min(clock.getDelta(),0.05);T+=dt*SPD;
 // input
 var dir=new THREE.Vector3();
 if(keys["arrowup"]||keys["w"]||keys["z"])dir.z-=1;if(keys["arrowdown"]||keys["s"])dir.z+=1;if(keys["arrowleft"]||keys["a"]||keys["q"])dir.x-=1;if(keys["arrowright"]||keys["d"])dir.x+=1;
 var speed=11;
 if(dir.lengthSq()===0&&target){var goal=waypoint||target;var d=goal.clone().sub(bot.position);d.y=0;var dist=d.length();
  if(dist<0.6){if(waypoint){waypoint=null;}else{target=null;}}else{dir.copy(d).normalize();if(!waypoint&&dist<3)speed=Math.max(3,dist*3.5);}}
 if(dir.lengthSq()>0)dir.normalize();
 vel.lerp(dir.multiplyScalar(speed),Math.min(1,dt*6));
 bot.position.x+=vel.x*dt;bot.position.z+=vel.z*dt;
 // collisions
 obstacles.forEach(function(o){var dx=bot.position.x-o.x,dz=bot.position.z-o.z,dd=Math.hypot(dx,dz),rr=o.r+0.9;if(dd<rr&&dd>0.0001){bot.position.x=o.x+dx/dd*rr;bot.position.z=o.z+dz/dd*rr;}});
 var rr0=Math.hypot(bot.position.x,bot.position.z);if(rr0>43.5){bot.position.x*=43.5/rr0;bot.position.z*=43.5/rr0;}
 var sp=vel.length();if(sp>0.3){var ang=Math.atan2(vel.x,vel.z);var cur=bot.rotation.y;var diff=((ang-cur+Math.PI*3)%(Math.PI*2))-Math.PI;bot.rotation.y=cur+diff*Math.min(1,dt*8);}
 bot.position.y=1.5+(reduced?0:Math.sin(T*3)*0.12);bot.rotation.x=Math.min(0.25,sp*0.02);
 bot.userData.ring.scale.setScalar(1+0.1*Math.sin(T*8));
 var blink=(Math.sin(T*1.3)>0.985)?0.15:1;bot.userData.eyes.forEach(function(e){e.scale.y=blink;});
 shadowBlob.position.set(bot.position.x,0.16,bot.position.z);botLight.position.set(bot.position.x,2.2,bot.position.z);
 if(statue){statue.rotation.y=Math.sin(T*0.4)*0.6;statue.position.y=4.4+Math.sin(T*1.2)*0.15;}
 marker.material.opacity=Math.max(0,marker.material.opacity-dt*0.8);
 // zones
 var inside=-1;for(var i=0;i<N;i++){if(Math.hypot(bot.position.x-ringPos[i].x,bot.position.z-ringPos[i].z)<3.4)inside=i;}
 ringMeshes.forEach(function(r,i){var on=i===inside;r.ring.material.opacity=on?1:0.55+0.3*Math.sin(T*2+i);r.disc.material.opacity=on?0.22:0.06;r.ring.scale.setScalar(on?1.05:1);});
 if(inside!==currentZone){currentZone=inside;renderDock();}
 if(inside>-1){if(inside!==dismissed&&openZone!==inside)openPanel(inside);}else{dismissed=-1;if(openZone>-1&&!touring)closePanel(false);}
 if(touring&&openZone>-1&&openZone===tourIdx&&!target){if(!panelHover)dwell+=dt;var pr=document.getElementById("prog");if(pr)pr.style.width=Math.min(100,dwell/DWELL*100)+"%";if(dwell>=DWELL)nextStop();}
 updaters.forEach(function(u){u(T,dt*SPD);});
 // camera
 camPos.copy(bot.position).add(camOff);camera.position.lerp(camPos,Math.min(1,dt*3));look.lerp(new THREE.Vector3(bot.position.x,1,bot.position.z),Math.min(1,dt*4));camera.lookAt(look);
 hintT+=dt;if(hintT>14)hintEl.style.opacity="0";
 renderer.render(scene,camera);}
look.copy(bot.position);
frame();
})();
</script>
