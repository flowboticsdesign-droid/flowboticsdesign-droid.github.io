<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowBotics — Software development agency</title>
<meta name="description" content="FlowBotics advises and accompanies companies through every software project: business intelligence, agentic automation, digitalisation, websites and apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070B;--bg2:#0C0E15;--line:#1A1E2A;--line2:#2A3040;--text:#EDEFF4;--mute:#A0A8B8;--dim:#6B7486;--acc:#2FA557;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--text)}a:hover{color:var(--acc)}
img{max-width:100%}
[hidden]{display:none !important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
.disp{font-family:'Unbounded',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.spot{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(520px circle at var(--mx,70%) var(--my,30%),rgba(46,160,82,.10),transparent 60%)}
.progress{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);z-index:60}
main,footer,section{position:relative;z-index:3}
.gridbg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px}
header.top{position:sticky;top:0;z-index:40;background:rgba(6,7,11,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
.navlinks{display:flex;gap:28px}
.navlink{color:var(--mute);text-decoration:none;font-size:15px;padding:12px 2px}
.navlink:hover{color:var(--text)}
.right{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.lang button{min-width:44px;min-height:38px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:600 12px 'JetBrains Mono',monospace;letter-spacing:.06em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.lang button:focus-visible,.btn:focus-visible,.nav-btn:focus-visible,.thumb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s ease;cursor:pointer}
.btn:hover{transform:translateY(-3px)}
.btn-acc{background:var(--acc);color:#06070B}.btn-acc:hover{color:#06070B}
.btn-ghost{border:1px solid var(--line2);color:var(--text)}.btn-ghost:hover{border-color:var(--acc);color:var(--text)}
.btn-sm{min-height:44px;padding:0 20px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--mute);background:rgba(12,14,21,.7)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.eyebrow{font-size:12px;color:var(--acc);margin-bottom:18px}
.h2{font-size:clamp(34px,4.4vw,60px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.02em}
.lead{color:var(--mute);line-height:1.65;font-size:17px;margin:0}
/* hero */
.hero{border-bottom:1px solid var(--line);overflow:hidden}
.hero-in{position:relative;padding:110px 40px 120px}
.hero h1{font-size:clamp(40px,6vw,84px);line-height:1.02;font-weight:900;margin:32px 0 28px;letter-spacing:-.03em;max-width:1000px}
.rot{display:block;height:1.12em;overflow:hidden;font-size:.82em;white-space:nowrap}
.rot-in{display:flex;flex-direction:column;animation:rot 15s cubic-bezier(.7,0,.2,1) infinite}
.rot-in span{height:1.12em;line-height:1.12em;color:var(--acc)}
@keyframes rot{0%,13%{transform:translateY(0)}16.6%,30%{transform:translateY(-1.12em)}33.3%,46%{transform:translateY(-2.24em)}50%,63%{transform:translateY(-3.36em)}66.6%,80%{transform:translateY(-4.48em)}83.3%,96%{transform:translateY(-5.6em)}100%{transform:translateY(-6.72em)}}
.hero p.sub{font-size:20px;line-height:1.6;color:var(--mute);max-width:600px;margin:0 0 40px}
.orbit-wrap{position:absolute;right:-40px;top:50%;width:min(46vw,600px);transform:translateY(-50%);opacity:.9;pointer-events:none}
.hero-text{position:relative;z-index:2;max-width:760px}
.orbit{transform-box:view-box;transform-origin:center;animation:orbit 60s linear infinite}
.orbit .lbl{transform-box:fill-box;transform-origin:center;animation:orbitR 60s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes orbitR{to{transform:rotate(-360deg)}}
.flow path{fill:none;stroke-linecap:round}
.flow path.f{stroke-dasharray:4 10;animation:dash 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-300}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.fig{padding:40px 24px;border-left:1px solid var(--line)}
.fig .v{font-size:44px;font-weight:700;letter-spacing:-.02em}
.fig .l{font-size:11px;color:var(--dim);margin-top:8px}
/* manifesto */
.manifesto{font-size:clamp(26px,3.2vw,46px);line-height:1.28;font-weight:500;margin:0;max-width:1120px}
.word{opacity:.14;transition:opacity .6s ease}
.word.in{opacity:1}
/* services */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-bottom:56px}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.b-l{grid-column:span 4}.b-s{grid-column:span 2}.b-m{grid-column:span 3}
.cap{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:28px;padding:36px;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .4s ease;display:flex;flex-direction:column;gap:18px}
.cap:hover{transform:translateY(-6px);border-color:var(--c)}
.cap-glow{position:absolute;width:320px;height:320px;right:-120px;top:-120px;border-radius:50%;background:var(--c);filter:blur(110px);opacity:.16;transition:opacity .5s ease;pointer-events:none}
.cap:hover .cap-glow{opacity:.32}
.cap h3{font-size:26px;line-height:1.15;margin:0;font-weight:700;position:relative}
.cap p{color:var(--mute);line-height:1.65;margin:0;font-size:16px;flex:1;position:relative}
.tags{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:5px 9px}
/* marquee */
.mq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:34px 0;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.marquee{display:flex;gap:64px;white-space:nowrap;width:max-content;font-size:clamp(26px,3vw,40px);animation:slide 40s linear infinite}
.marquee.rev{animation-direction:reverse;animation-duration:52s;font-weight:300;color:var(--dim)}
.marquee span{display:inline-flex;align-items:center;gap:64px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* approach */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.sticky{position:sticky;top:120px}
.formats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:540px;margin-top:36px}
.fmt{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--bg2)}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:44px}
.phase{border-left:1px solid var(--line2);padding:8px 0 8px 28px;position:relative}
.phase:before{content:"";position:absolute;left:-5px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.phase h3{font-size:30px;font-weight:700;margin:10px 0 14px}
/* work */
.work{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.w-big{grid-column:span 7}.w-sm{grid-column:span 5}
.wcard{display:block;text-decoration:none;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:28px;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .4s ease}
.wcard:hover{transform:translateY(-6px);border-color:var(--acc);color:var(--text)}
.wcard .media{overflow:hidden}
.wcard img{display:block;width:100%;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.wcard:hover img{transform:scale(1.04)}
.wcard .body{padding:28px}
.wcard .k{font-size:11px}
.wcard h3{font-size:24px;font-weight:700;margin:10px 0 8px}
.wcard p{color:var(--mute);margin:0;line-height:1.55}
.bars{display:flex;align-items:flex-end;gap:8px}
.bars span{flex:1;border-radius:4px;transform-origin:bottom;animation:bar 3.2s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
/* fields */
.ind{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 4px;border-top:1px solid var(--line);transition:padding .4s ease,color .3s ease;color:var(--mute)}
.ind:hover{padding-left:20px;color:var(--text)}
.ind .t{font-size:clamp(18px,2vw,24px);font-weight:500}
/* studio */
.portrait{position:relative;aspect-ratio:4/5;border-radius:32px;border:1px solid var(--line);background:var(--bg2);overflow:hidden;display:flex;align-items:flex-end;padding:32px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.fact{border:1px solid var(--line);border-radius:18px;padding:18px}
/* contact */
.contact{padding:180px 0;border-top:1px solid var(--line);text-align:center}
.contact h2{font-size:clamp(44px,7vw,96px);line-height:.98;margin:36px 0 28px;font-weight:900;letter-spacing:-.04em}
footer{border-top:1px solid var(--line);padding:36px 0}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:11px;color:var(--dim)}
/* portfolio */
.jump{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;text-decoration:none;color:var(--mute);font-size:14px;white-space:nowrap;transition:border-color .3s ease,color .3s ease}
.jump:hover{color:var(--text);border-color:var(--c)}
.jdot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cat{padding:120px 0 40px;scroll-margin-top:80px}
.slide{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--bg2);border:1px solid var(--line);border-radius:32px;overflow:hidden;min-height:560px}
.slide.anim{animation:slideIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.vis{position:relative;background:#090B11;border-right:1px solid var(--line);padding:36px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vis>.gridbg{position:absolute;inset:0;opacity:.45}
.info{padding:44px;display:flex;flex-direction:column;gap:20px}
.info h3{font-size:clamp(24px,2.4vw,30px);line-height:1.15;margin:0;font-weight:700}
.info ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.info li{display:flex;gap:12px;align-items:flex-start;line-height:1.5;font-size:15px}
.nav-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s ease,background .3s ease}
.nav-btn:hover{border-color:var(--c);background:#11141D}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px}
.thumb{flex:none;text-align:left;min-height:44px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-size:13px;cursor:pointer;transition:all .3s ease}
.thumb:hover{color:var(--text)}
.thumb[aria-selected="true"]{border-color:var(--c);color:var(--text);background:#0E1119}
.pips{display:flex;justify-content:center;margin-top:18px}
.pip{width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pip span{display:block;height:4px;width:22px;border-radius:4px;background:var(--line2);transition:width .4s ease,background .4s ease}
.pip.on span{width:40px;background:var(--c)}
.frame{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.55);background:#0C0E15}
.chrome{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0F121A}
.chrome i{width:9px;height:9px;border-radius:50%;background:#2A3040;display:block}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.tl{animation:type .5s ease both}
@keyframes type{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.spin{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}
/* reveal */
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (max-width:980px){
.wrap,.hero-in{padding-left:16px;padding-right:16px}
.navlinks{display:none}
.bento,.work{grid-template-columns:minmax(0,1fr)}.b-l,.b-s,.b-m,.w-big,.w-sm{grid-column:auto}
.split,.slide{grid-template-columns:minmax(0,1fr)}
.sticky{position:static}
.orbit-wrap{position:relative;right:auto;top:auto;transform:none;width:100%;max-width:420px;margin:40px auto 0;opacity:.8}
.hero-in{padding-top:64px;padding-bottom:72px}
.vis{border-right:0;border-bottom:1px solid var(--line);padding:20px}.info{padding:26px}
.cap{padding:26px}.contact{padding:110px 0}
.hide-sm{display:none}
.rot{font-size:.68em}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}.word{opacity:1}}
</style>
</head>

/* ---------- helpers ---------- */
var lang="en";
function L(x){if(x==null)return"";if(typeof x==="string")return x;return x[lang]!=null?x[lang]:x.en;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pad(n){return(n<10?"0":"")+n;}
function $(id){return document.getElementById(id);}
var CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="COL" stroke-width="2.6" aria-hidden="true" style="flex:none;margin-top:4px"><path d="M5 12l5 5 9-10"/></svg>';

/* ---------- home renderers ---------- */
function renderHome(){
$("rot").innerHTML=ROT[lang].concat([ROT[lang][0]]).map(function(w){return"<span>"+esc(w)+"</span>";}).join("");
$("figs").innerHTML=FIGS.map(function(f){return'<div class="fig rv"><div class="disp v">'+f.v+'</div><div class="mono l">'+esc(L(f.l))+"</div></div>";}).join("");
$("manifesto").innerHTML=MANIFESTO[lang].split(" ").map(function(w){return'<span class="word">'+esc(w)+" </span>";}).join("");
$("caps").innerHTML=CAPS.map(function(c){return'<article class="cap '+c.cls+' rv" style="--c:'+c.color+'"><div class="cap-glow" aria-hidden="true"></div><div style="display:flex;justify-content:space-between;align-items:center;position:relative"><span class="mono" style="font-size:12px;color:'+c.color+'">'+c.n+" / "+c.short+'</span><span class="mono" style="font-size:11px;color:var(--dim)">'+esc(L(c.count))+'</span></div><h3 class="disp">'+esc(L(c.title))+"</h3><p>"+esc(L(c.desc))+'</p><div class="tags">'+c.stack.map(function(t){return'<span class="tag">'+esc(t)+"</span>";}).join("")+"</div></article>";}).join("");
var star='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="#2FA557"/></svg>';
$("mqA").innerHTML=STACK_A.concat(STACK_A).map(function(s){return"<span>"+esc(s)+star+"</span>";}).join("");
$("mqB").innerHTML=STACK_B.concat(STACK_B).map(function(s){return"<span>"+esc(s)+'<span style="color:#2A3040">/</span></span>';}).join("");
$("formats").innerHTML=FORMATS.map(function(f){return'<div class="fmt"><div class="mono" style="font-size:11px;color:var(--acc)">'+esc(L(f.k))+'</div><div style="margin-top:8px;font-weight:600">'+esc(L(f.t))+'</div><div style="margin-top:6px;color:var(--dim);font-size:14px;line-height:1.5">'+esc(L(f.d))+"</div></div>";}).join("");
var ph={en:"Phase",fr:"Phase",es:"Fase"};
$("phases").innerHTML=PHASES.map(function(p,i){return'<li class="phase rv"><div class="mono" style="font-size:12px;color:var(--dim)">'+ph[lang]+" "+pad(i+1)+'</div><h3 class="disp">'+esc(L(p.t))+'</h3><p class="lead" style="margin-bottom:16px;line-height:1.7">'+esc(L(p.d))+'</p><div class="mono" style="font-size:11px">→ '+esc(L(p.o))+"</div></li>";}).join("");
$("fields").innerHTML=FIELDS.map(function(f){return'<div class="ind rv"><span class="disp t">'+esc(L(f.t))+'</span><span class="mono" style="font-size:11px;text-align:right">'+esc(L(f.d))+"</span></div>";}).join("");
}

/* ---------- portfolio renderers ---------- */
var idx={};
function visual(s,color){
if(s.v==="img")return'<div class="frame float"><div class="chrome" aria-hidden="true"><i></i><i></i><i></i><span class="mono" style="font-size:10px;color:var(--dim);margin-left:10px">'+esc(s.url)+'</span></div><img src="'+s.img+'" alt="'+esc(s.alt)+'" style="display:block;width:100%;height:auto"></div>';
if(s.v==="dash"){var b=s.bars.map(function(h,i){return'<span style="height:'+h+'%;background:'+s.hue+';animation-delay:'+(-i*.35)+'s"></span>';}).join("");
var r=["92%","74%","60%","45%","30%"].map(function(w){return'<span style="height:8px;width:'+w+';background:'+s.hue+';border-radius:4px;opacity:.85;display:block"></span>';}).join("");
return'<div class="frame float" aria-hidden="true" style="background:'+s.bg+';padding:18px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="disp" style="font-size:14px;font-weight:700;color:'+s.ink+'">'+esc(s.dt)+'</span><span style="display:flex;gap:6px"><span style="width:46px;height:16px;border-radius:5px;background:'+s.tile+'"></span><span style="width:46px;height:16px;border-radius:5px;background:'+s.tile+'"></span></span></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">'+s.kpis.map(function(k){return'<div style="background:'+s.tile+';border-radius:10px;padding:12px"><div class="mono" style="font-size:9px;color:'+s.sub+'">'+esc(k[0])+'</div><div class="disp" style="font-size:20px;font-weight:700;color:'+s.ink+';margin-top:6px">'+esc(k[1])+"</div></div>";}).join("")+'</div><div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px"><div class="bars" style="height:170px;background:'+s.tile+';border-radius:10px;padding:14px;gap:6px">'+b+'</div><div style="height:170px;background:'+s.tile+';border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-around">'+r+"</div></div></div>";}
if(s.v==="flow"){return'<div class="float" aria-hidden="true" style="position:relative;width:100%;display:flex;flex-direction:column;gap:14px">'+s.nodes.map(function(n,i){var bd=(i===0||i===s.nodes.length-1)?color:"#2A3040";return'<div style="display:flex;align-items:center;gap:14px;margin-left:'+(i%2?28:0)+'px"><span class="mono" style="font-size:10px;color:var(--dim);width:26px">'+pad(i+1)+'</span><div style="flex:1;max-width:380px;border:1px solid '+bd+';background:#0E1119;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-weight:600;font-size:14px">'+esc(n[0])+'</span><span class="mono" style="font-size:10px;color:'+color+'">'+esc(n[1])+"</span></div></div>";}).join("")+"</div>";}
if(s.v==="code"){var cols={p:"#2FA557",c:"#6B7486",t:"#EDEFF4",o:"#3DE0C2"};return'<div class="frame float" aria-hidden="true"><div class="chrome"><i></i><i></i><i></i><span class="mono" style="font-size:10px;color:var(--dim);margin-left:10px">'+esc(s.url)+'</span></div><div style="padding:22px;font-family:\'JetBrains Mono\',monospace;font-size:13px;line-height:1.9;min-height:300px">'+s.lines.map(function(l,i){return'<div class="tl" style="animation-delay:'+(i*.12)+'s;color:'+cols[l[0]]+';white-space:pre-wrap">'+esc(l[1])+"</div>";}).join("")+"</div></div>";}
if(s.v==="site"){return'<div class="frame float" aria-hidden="true" style="background:'+s.bg+'"><div class="chrome"><i></i><i></i><i></i><span class="mono" style="font-size:10px;color:var(--dim);margin-left:10px">'+esc(s.url)+'</span></div><div style="padding:22px 26px 30px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:40px"><span style="font-weight:700;color:'+s.ink+';font-size:13px">'+esc(s.brand)+'</span><span style="display:flex;gap:14px"><span style="width:34px;height:6px;border-radius:3px;background:'+s.sub+'"></span><span style="width:34px;height:6px;border-radius:3px;background:'+s.sub+'"></span><span style="width:34px;height:6px;border-radius:3px;background:'+s.sub+'"></span></span></div><div style="font-family:Georgia,serif;font-size:32px;line-height:1.1;color:'+s.ink+';max-width:380px">'+esc(L(s.hero))+'</div><div style="width:120px;height:34px;border-radius:999px;background:'+s.hue+';margin:22px 0 30px"></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">'+s.cards.map(function(c){return'<div style="border-radius:10px;background:'+s.tile+';padding:12px;min-height:76px"><div style="font-size:11px;font-weight:600;color:'+s.ink+'">'+esc(c)+'</div><div style="height:5px;width:70%;border-radius:3px;background:'+s.sub+';margin-top:10px;opacity:.6"></div><div style="height:5px;width:50%;border-radius:3px;background:'+s.sub+';margin-top:6px;opacity:.6"></div></div>';}).join("")+"</div></div></div>";}
if(s.v==="app"){return'<div class="frame float" aria-hidden="true" style="display:grid;grid-template-columns:56px minmax(0,1fr);min-height:340px"><div style="background:#0F121A;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:18px"><span style="width:26px;height:26px;border-radius:8px;background:'+color+'"></span><span style="width:22px;height:22px;border-radius:6px;background:#1A1E2A"></span><span style="width:22px;height:22px;border-radius:6px;background:#1A1E2A"></span><span style="width:22px;height:22px;border-radius:6px;background:#1A1E2A"></span></div><div style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span class="disp" style="font-size:15px;font-weight:700">'+esc(s.appTitle)+'</span><span style="padding:6px 12px;border-radius:999px;background:'+color+';color:#06070B;font-size:11px;font-weight:700">'+esc(s.cta)+"</span></div>"+s.items.map(function(it){return'<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:12px"><span>'+esc(it[0])+'</span><span style="color:var(--mute)">'+esc(it[1])+'</span><span class="mono" style="font-size:10px;color:'+it[3]+';text-align:right">'+esc(it[2])+"</span></div>";}).join("")+"</div></div>";}
if(s.v==="motion"){return'<svg viewBox="0 0 400 300" width="100%" style="position:relative;max-width:520px" aria-hidden="true"><circle class="spin" cx="200" cy="150" r="120" fill="none" stroke="'+color+'" stroke-opacity=".4" stroke-dasharray="3 9"/><circle class="spin" cx="200" cy="150" r="84" fill="none" stroke="#2A3040" stroke-dasharray="40 14"/><rect x="150" y="100" width="100" height="100" rx="26" fill="#0E1119" stroke="'+color+'"/><text x="200" y="158" fill="#EDEFF4" font-family="Unbounded, sans-serif" font-size="16" font-weight="700" text-anchor="middle">'+esc(s.glyph)+'</text><text x="200" y="290" fill="#6B7486" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">'+esc(s.caption)+"</text></svg>";}
return"";}

function slideHTML(c,animate){
var i=idx[c.id]||0,s=c.slides[i],len=c.slides.length;
var tabs=c.slides.map(function(x,j){return'<button class="thumb" role="tab" aria-selected="'+(j===i)+'" data-cat="'+c.id+'" data-to="'+j+'"><span class="mono" style="font-size:10px;display:block;margin-bottom:4px;color:'+c.color+'">'+pad(j+1)+"</span>"+esc(L(x.title))+"</button>";}).join("");
var pips=c.slides.map(function(x,j){return'<button class="pip'+(j===i?" on":"")+'" aria-label="'+pad(j+1)+'" data-cat="'+c.id+'" data-to="'+j+'"><span></span></button>';}).join("");
return'<div class="thumbs" role="tablist" aria-label="'+esc(L(c.name))+'">'+tabs+'</div>'+
'<article class="slide'+(animate?" anim":"")+'" role="tabpanel"><div class="vis"><div class="gridbg" aria-hidden="true"></div>'+visual(s,c.color)+'</div>'+
'<div class="info"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span class="mono" style="font-size:11px;color:'+c.color+'">'+esc(L(s.type))+'</span><span class="mono" style="font-size:11px;color:var(--dim)">'+esc(L(s.year))+'</span></div>'+
'<div><div style="color:var(--mute);font-size:14px;margin-bottom:8px">'+esc(L(s.client))+'</div><h3 class="disp">'+esc(L(s.title))+"</h3></div>"+
'<p class="lead" style="font-size:16px;line-height:1.7">'+esc(L(s.summary))+"</p>"+
"<ul>"+L(s.built).map(function(b){return"<li>"+CHECK.replace("COL",c.color)+"<span>"+esc(b)+"</span></li>";}).join("")+"</ul>"+
'<div class="tags" style="margin-top:auto;padding-top:8px">'+s.stack.map(function(t){return'<span class="tag">'+esc(t)+"</span>";}).join("")+"</div></div></article>"+
'<div class="pips">'+pips+"</div>";}

function renderCatBody(c,animate){$("body-"+c.id).innerHTML=slideHTML(c,animate);$("ctr-"+c.id).textContent=pad((idx[c.id]||0)+1)+" / "+pad(c.slides.length);}

function renderPortfolio(){
var total=0;CATS.forEach(function(c){total+=c.slides.length;});
$("pfTotal").textContent=total+" "+L(T.pf_projects);
$("jumps").innerHTML=CATS.map(function(c){return'<a class="jump" href="#p-'+c.id+'" style="--c:'+c.color+'"><span class="jdot"></span>'+esc(L(c.name))+'<span class="mono" style="font-size:10px;color:var(--dim)">'+pad(c.slides.length)+"</span></a>";}).join("");
var arrowL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
var arrowR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
$("cats").innerHTML=CATS.map(function(c){return'<section class="cat" id="p-'+c.id+'" style="--c:'+c.color+'"><div class="wrap"><div class="sec-head rv" style="margin-bottom:36px"><div><div class="mono" style="font-size:12px;color:'+c.color+';margin-bottom:16px">'+c.n+" — "+esc(L(c.short))+'</div><h2 class="disp h2" style="font-size:clamp(32px,3.8vw,52px)">'+esc(L(c.name))+'</h2><p class="lead" style="max-width:620px;margin-top:18px">'+esc(L(c.intro))+'</p></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" id="ctr-'+c.id+'" style="font-size:13px;color:var(--dim);min-width:70px;text-align:right"></span><button class="nav-btn" data-cat="'+c.id+'" data-step="-1" aria-label="'+esc(L(T.prev))+'">'+arrowL+'</button><button class="nav-btn" data-cat="'+c.id+'" data-step="1" aria-label="'+esc(L(T.next))+'">'+arrowR+'</button></div></div><div id="body-'+c.id+'"></div></div></section>';}).join("");
CATS.forEach(function(c){renderCatBody(c,false);});
}

/* ---------- carousel events ---------- */
document.addEventListener("click",function(e){
var b=e.target.closest("[data-cat]");if(!b||b.tagName!=="BUTTON")return;
var id=b.getAttribute("data-cat"),c=CATS.filter(function(x){return x.id===id;})[0];if(!c)return;
var len=c.slides.length,cur=idx[id]||0,n;
if(b.hasAttribute("data-step"))n=(cur+parseInt(b.getAttribute("data-step"),10)+len)%len;else n=parseInt(b.getAttribute("data-to"),10);
if(n===cur)return;idx[id]=n;renderCatBody(c,true);
});
/* swipe on slides */
var sx=null,sid=null;
document.addEventListener("touchstart",function(e){var s=e.target.closest(".cat");if(!s)return;sid=s.id.slice(2);sx=e.touches[0].clientX;},{passive:true});
document.addEventListener("touchend",function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;var c=CATS.filter(function(x){return x.id===sid;})[0];sx=null;if(!c||Math.abs(dx)<60)return;var len=c.slides.length;idx[c.id]=((idx[c.id]||0)+(dx<0?1:-1)+len)%len;renderCatBody(c,true);},{passive:true});

/* ---------- language ---------- */
function applyStatic(){
document.documentElement.lang=lang;
Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){var k=el.getAttribute("data-i18n");if(T[k])el.innerHTML=T[k][lang];});
Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===lang));});
}
function setLang(l){lang=l;try{localStorage.setItem("fb-lang",l);}catch(e){}applyStatic();renderHome();renderPortfolio();observe();}
Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"),function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"));});});

/* ---------- reveal ---------- */
var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{rootMargin:"0px 0px -8% 0px"}):null;
function observe(){Array.prototype.forEach.call(document.querySelectorAll(".rv:not(.in),.word:not(.in)"),function(el){if(io)io.observe(el);else el.classList.add("in");});}

/* ---------- routing ---------- */
function route(){
var h=location.hash||"";var pf=(h==="#portfolio"||h.indexOf("#p-")===0);
$("view-home").hidden=pf;$("view-portfolio").hidden=!pf;
var target=h&&h!=="#portfolio"?document.getElementById(h.slice(1)):null;
if(target){setTimeout(function(){target.scrollIntoView({behavior:"smooth"});},30);}else{window.scrollTo(0,0);}
observe();
}
window.addEventListener("hashchange",route);

/* ---------- pointer spotlight + progress ---------- */
var spot=$("spot"),prog=$("progress");
window.addEventListener("pointermove",function(e){spot.style.setProperty("--mx",e.clientX+"px");spot.style.setProperty("--my",e.clientY+"px");},{passive:true});
window.addEventListener("scroll",function(){var d=document.documentElement;var m=d.scrollHeight-d.clientHeight;prog.style.transform="scaleX("+(m>0?d.scrollTop/m:0)+")";},{passive:true});

/* ---------- init ---------- */
var saved=null;try{saved=localStorage.getItem("fb-lang");}catch(e){}
var nav=(navigator.language||"en").slice(0,2);
lang=saved||(["en","fr","es"].indexOf(nav)>-1?nav:"en");
applyStatic();renderHome();renderPortfolio();route();
})();
</script>
</body>
</html>
